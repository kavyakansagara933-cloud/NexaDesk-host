<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Macky Host</title>

  <style>
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #14151a;
      color: #e8e8ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #9a9ab0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    #status {
      font-size: 13px;
      color: #8a8a9a;
      margin-bottom: 16px;
    }

    #code {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #7c9eff;
      font-family: "Consolas", monospace;
    }

    #hint {
      font-size: 12px;
      color: #6a6a7a;
      margin-top: 20px;
      max-width: 300px;
      text-align: center;
    }

    #preview {
      margin-top: 20px;
      width: 320px;
      border-radius: 6px;
      border: 1px solid #2a2a35;
      display: none;
    }
  </style>
</head>

<body>
  <h1>Macky Host</h1>

  <div id="status">Connecting to signaling server...</div>

  <div id="code">------</div>

  <div id="hint">
    Enter this code in the Macky Android app to pair.
  </div>

  <video id="preview" autoplay muted></video>

  <script src="renderer.js"></script>
</body>
</html>
